name: Release VPM Packages

on:
  workflow_run:
    workflows: [Build release candidate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exporter version without the v prefix
        required: true
        default: 0.11.14
      channel:
        description: Explicit publication channel (beta keeps the stable latest release)
        type: choice
        options: [beta, stable]
        required: true
        default: stable
      expected_commit:
        description: Full reviewed main commit SHA to publish
        required: true
      expected_package_sha256:
        description: SHA256 of the validated exporter ZIP
        required: true
      candidate_run_id:
        description: Successful Build release candidate run for this commit and ZIP
        required: true

permissions: {}

concurrency:
  group: release-vpm
  cancel-in-progress: false
  queue: max

jobs:
  resolve-candidate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
      version: ${{ steps.candidate.outputs.version }}
      expected_commit: ${{ steps.candidate.outputs.expected_commit }}
      package_sha256: ${{ steps.candidate.outputs.package_sha256 }}
      candidate_run_id: ${{ steps.candidate.outputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Authenticate completed staging candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/resolve-staging-beta.py
  release:
    needs: resolve-candidate
    if: always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && needs.resolve-candidate.result == 'success' && needs.resolve-candidate.outputs.publish == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.expected_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify versions
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORTER_VERSION: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.version || inputs.version }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_run' && 'beta' || inputs.channel }}
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.expected_commit || inputs.expected_commit }}
        run: |
          python3 Tools/release_policy.py > release-flags.txt
      - name: Install pinned workflow parser
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r Tools/pipeline-requirements.txt'
      - name: Lint workflows with a pinned binary
        run: python3 Tools/run-actionlint.py
      - name: Run complete host validation
        run: python3 Tools/run-validation.py --report work/validation.json
      - name: Verify authentic candidate receipt before publication
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.candidate_run_id || inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.expected_commit || inputs.expected_commit }}
          VERSION: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.version || inputs.version }}
          EXPECTED_PACKAGE_SHA256: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.package_sha256 || inputs.expected_package_sha256 }}
        run: |
          python3 Tools/verify-release-candidate.py \
            --run-id "$CANDIDATE_RUN_ID" --commit "$EXPECTED_COMMIT" \
            --version "$VERSION" --package-sha256 "$EXPECTED_PACKAGE_SHA256"
      - name: Build exporter package
        env:
          VERSION: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.version || inputs.version }}
          EXPECTED_PACKAGE_SHA256: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.package_sha256 || inputs.expected_package_sha256 }}
        run: |
          python3 Tools/build-package.py --output "artifacts/com.vrvlog.liltoon-vrm-exporter-${VERSION}.zip"
          python3 - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          expected = os.environ["EXPECTED_PACKAGE_SHA256"]
          actual = hashlib.sha256(Path("artifacts/com.vrvlog.liltoon-vrm-exporter-" + os.environ["VERSION"] + ".zip").read_bytes()).hexdigest()
          if not re.fullmatch(r"[0-9a-f]{64}", expected) or actual != expected:
              raise SystemExit("Built ZIP differs from the validated release candidate: " + actual)
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.version || inputs.version }}
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.expected_commit || inputs.expected_commit }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Refusing to publish: tag v${VERSION} already exists and is not owned by this run." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = "## " + os.environ["VERSION"] + "\n"
          if heading not in changelog:
              raise SystemExit("Missing changelog entry for this version")
          notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Release notes must not be empty")
          Path("artifacts/release-notes.md").write_text(notes, encoding="utf-8")
          PY
          mapfile -t release_flags < release-flags.txt
          assets=("artifacts/com.vrvlog.liltoon-vrm-exporter-${VERSION}.zip")
          gh release create "v${VERSION}" \
            "${assets[@]}" \
            --title "VR Vlog lilToon VRM Exporter ${VERSION}" \
            --target "${EXPECTED_COMMIT}" \
            --notes-file artifacts/release-notes.md \
            "${release_flags[@]}"
  dispatch-listing:
    needs: [release, resolve-candidate]
    if: always() && !cancelled() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start VPM listing deployment when enabled
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_run' && needs.resolve-candidate.outputs.version || inputs.version }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_run' && 'beta' || inputs.channel }}
        run: |
          listing_state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-listing.yml" --jq .state)
          if [ "$listing_state" = "active" ]; then
            listing_ref=main
            if [ "$RELEASE_CHANNEL" = beta ]; then
              listing_ref="v${VERSION}"
            fi
            gh workflow run build-listing.yml --repo "$GITHUB_REPOSITORY" --ref "$listing_ref"
          else
            echo "Release published. Website/VPM deployment remains paused (workflow state: ${listing_state})." >> "$GITHUB_STEP_SUMMARY"
          fi
