name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check Gitflow pull request target
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/check-gitflow.py
      - name: Install pinned workflow parser
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r Tools/pipeline-requirements.txt'
      - name: Lint workflows with a pinned binary
        run: python3 Tools/run-actionlint.py
      - name: Run complete host validation
        run: python3 Tools/run-validation.py --report work/validation.json
      - name: Build installer preview
        run: python3 Tools/build-installer.py --output work/installer/com.vrvlog.liltoon-vrm-exporter-installer.unitypackage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vpm-installer
          path: work/installer
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
